name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ARCH: arm64
  DEFCONFIG: begonia_user_defconfig
  # TRB (The Raging Beast) Clang 18 from VoltageOS — the toolchain VoltageOS
  # uses to build its begonia kernels. Pinned to the same commit pox uses.
  TRB_CLANG_URL: https://gitlab.com/voltageos/clang/-/archive/b0fa406b3f65eae210c60dda2e91dae979e4b3a8/clang-b0fa406b3f65eae210c60dda2e91dae979e4b3a8.tar.gz
  TRB_CLANG_PIN: b0fa406b3f65eae210c60dda2e91dae979e4b3a8
  ANYKERNEL_REPO: https://github.com/cvnertnc/AnyKernel3/
  ANYKERNEL_BRANCH: begonia

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio curl flex libelf-dev libssl-dev \
            libncurses5-dev wget zip unzip git python3 \
            libxml2 libxml2-dev zlib1g libtinfo5 libc++1 libc++abi1

      - name: Download TRB Clang 18
        run: |
          mkdir -p toolchains/clang
          curl -L --fail --retry 3 -o clang.tar.gz "${TRB_CLANG_URL}"
          tar -xzf clang.tar.gz -C toolchains/clang --strip-components=1
          rm -f clang.tar.gz
          echo "CLANG_BIN=$PWD/toolchains/clang/bin" >> $GITHUB_ENV
          toolchains/clang/bin/clang --version | head -1

      - name: Make defconfig
        run: |
          export PATH="$CLANG_BIN:$PATH"
          make O=out ARCH=$ARCH $DEFCONFIG

      - name: Build kernel
        run: |
          export PATH="$CLANG_BIN:$PATH"
          make -j$(nproc) O=out ARCH=$ARCH \
            CC="$CLANG_BIN/clang" \
            CROSS_COMPILE="$CLANG_BIN/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$CLANG_BIN/arm-linux-gnueabi-" \
            LD="$CLANG_BIN/ld.lld" \
            AR="$CLANG_BIN/llvm-ar" \
            NM="$CLANG_BIN/llvm-nm" \
            OBJCOPY="$CLANG_BIN/llvm-objcopy" \
            OBJDUMP="$CLANG_BIN/llvm-objdump" \
            STRIP="$CLANG_BIN/llvm-strip" \
            LLVM=1 LLVM_IAS=1

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 --branch "${ANYKERNEL_BRANCH}" \
            "${ANYKERNEL_REPO}" AnyKernel3

      - name: Package flashable zip
        run: |
          if [ -f out/arch/$ARCH/boot/Image.gz ]; then
            cp -f out/arch/$ARCH/boot/Image.gz AnyKernel3/
          elif [ -f out/arch/$ARCH/boot/Image ]; then
            cp -f out/arch/$ARCH/boot/Image AnyKernel3/
          else
            echo "No kernel image found"; exit 1
          fi
          cd AnyKernel3
          BUILD_TIME=$(date +"%Y%m%d-%H%M")
          zip -q -r "../kernel-${BUILD_TIME}.zip" .
          cd ..
          echo "ZIP=kernel-${BUILD_TIME}.zip" >> $GITHUB_ENV

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-flashable-zip
          path: kernel-*.zip

      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: out/arch/arm64/boot/Image.gz